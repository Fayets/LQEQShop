# Igual que LopianaClothes: la tienda entra a la MISMA red que el nginx de Coquetines,
# que la resuelve por nombre (proxy_pass http://lqeq:8030). No publica puertos al host.
services:
  lqeq:
    build: .
    container_name: lqeq
    restart: unless-stopped
    env_file: .env
    volumes:
      # bind mounts: pedidos y fotos quedan en el host y sobreviven a cualquier rebuild
      - ./data:/app/data
      - ./media:/app/media
    networks:
      - proxy
    expose:
      - "8030"

networks:
  proxy:
    name: coquetines_default
    external: true
