# ETAPA 1 — puerto 80. Va ANTES de pedir el certificado (nginx no arranca si un bloque
# 443 apunta a un certificado que todavía no existe). DOMINIO se reemplaza al instalar.
server {
    listen 80;
    server_name DOMINIO www.DOMINIO;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/certbot-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
