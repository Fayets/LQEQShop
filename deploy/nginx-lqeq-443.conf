# ETAPA 2 — puerto 443. Va DESPUÉS de que certbot emitió el certificado.
server {
    listen 443 ssl;
    server_name DOMINIO www.DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

    # las fotos del iPhone pasan el 15m global de Coquetines
    client_max_body_size 30m;

    location / {
        proxy_pass http://lqeq:8030;
        # Host: la app valida el dominio contra LQEQ_HOSTS
        proxy_set_header Host              $host;
        # sin esto el límite de intentos de login vería a todos como una sola IP
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
